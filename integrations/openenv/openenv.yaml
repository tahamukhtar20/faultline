spec_version: 1
name: faultline_env
version: 0.1.0
type: space
runtime: fastapi
app: server.app:app
port: 8000
validation:
  reward:
    range: [-1.1, 1.0]
    oracle_tolerance: 0.05
    floor_margin: 0.1
  resources:
    cpu: 4.0
    memory_mb: 8192
    disk_mb: 4096
    episode_timeout_s: 1800.0
  capabilities:
    verifier:
      kind: reward_channel
  types:
    tags: [coding-agents, debugging, reliability]
