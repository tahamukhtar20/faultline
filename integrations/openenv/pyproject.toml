[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-faultline_env"
version = "0.1.0"
description = "Faultline as an OpenEnv environment"
requires-python = ">=3.11"
dependencies = [
  "faultline-rl",
  "openenv>=0.12",
]

[project.scripts]
server = "faultline_env.server.app:main"

[tool.uv.sources]
faultline-rl = { path = "../..", editable = true }

[tool.setuptools]
include-package-data = true
packages = ["faultline_env", "faultline_env.server"]
package-dir = { "faultline_env" = ".", "faultline_env.server" = "server" }
